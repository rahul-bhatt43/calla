# =============================================================================
# coturn — self-hosted STUN/TURN
# =============================================================================
# This server does two jobs with very different costs:
#
#   STUN  tells a peer its own public address. One tiny UDP round trip, then
#         the peers talk directly and we are out of the loop entirely. This is
#         what happens for the large majority of connections.
#
#   TURN  relays the actual media because the two peers genuinely cannot reach
#         each other (symmetric NAT, restrictive corporate firewalls). Every
#         byte of that call crosses this box, in both directions. It is the
#         only per-byte cost in the whole architecture.
#
# Everything below is aimed at keeping the second case rare, bounded, and
# impossible for outsiders to use as a free proxy.
# =============================================================================

listening-port=3478
tls-listening-port=5349

fingerprint

# --- Authentication ----------------------------------------------------------
# Time-limited credentials (the "REST API" scheme). The client is handed
# username `<expiry>:<userId>` and password HMAC-SHA1(secret, username); coturn
# recomputes the HMAC and needs no user database at all.
#
# The alternative — a fixed username and password — leaks permanently the first
# time anyone opens devtools, and open TURN servers are actively scanned for.
use-auth-secret
static-auth-secret=dev-turn-secret-change-me
realm=localhost

# --- Quotas ------------------------------------------------------------------
# Hard ceilings, because this is where a bill can run away. A relayed 720p call
# is roughly 3 Mbps through here; the client also caps its own bitrate once it
# detects it is being relayed, but that is a cooperating-client assumption and
# these limits are not.
user-quota=12
total-quota=1200
# Per-allocation bandwidth ceiling in bytes/sec (~1 Mbps).
max-bps=128000
# Aggregate ceiling in bytes/sec (~400 Mbps). Tune to your uplink.
bps-capacity=50000000

# --- Relay port range --------------------------------------------------------
# Widen substantially in production; each concurrent relayed stream needs a port.
min-port=49160
max-port=49200

# --- Hardening ---------------------------------------------------------------
# Deny relaying to private ranges. Without these an open TURN server becomes a
# pivot into whatever network it is hosted on.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# The legacy TURN protocol has no benefit for WebRTC and widens the attack area.
no-tlsv1
no-tlsv1_1

# CLI admin port off by default — it is a remote shell into the relay.
no-cli

# --- Logging -----------------------------------------------------------------
log-file=stdout
simple-log
# Per-session logs are extremely chatty at scale; enable only when debugging.
no-stdout-log-verbose

# --- TLS ---------------------------------------------------------------------
# Point these at real certificates in production. turns:// on 5349 is what gets
# through firewalls that only permit TLS-shaped traffic.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# --- Production notes --------------------------------------------------------
# Set these on a real deployment:
#   external-ip=<public IP>/<private IP>   (required behind cloud NAT)
#   realm=<your domain>
#   static-auth-secret=<match TURN_SECRET in .env>
